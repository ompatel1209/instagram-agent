name: Daily trending refresh

on:
  schedule:
    - cron: "3 3 * * *"     # 03:03 UTC = 8:33 AM IST — daily, BEFORE the
                            # 03:33 UTC (9:03 IST) post checkout so the day's
                            # captions already carry the fresh trending window
  workflow_dispatch:        # manual "Run workflow" button — the probe

concurrency:
  group: instagram-trending
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trending:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (main, with tokens)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run trending refresh
        env:
          GH_PAT: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m src.refresh

      - name: Push state + hashtags to main
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
        run: bash scripts/push_state.sh

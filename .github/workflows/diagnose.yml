name: Diagnose engagement

# Read-only: prints what the Graph API currently sees — media, every
# comment (author + text), and every DM thread — so "nothing arrived" can be
# told apart from "the agent can't see it". Makes no replies and writes
# nothing.
on:
  workflow_dispatch:

concurrency:
  group: instagram-diagnose
  cancel-in-progress: true

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Dump comments + DMs
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/diagnose_engagement.py
